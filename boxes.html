<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obverse — Boxes</title>
  <meta name="description" content="Obverse handcrafted boxes — laser-cut and engraved wooden boxes with acrylic inlay.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 64px;
    }

    /*
      Same column width logic as home page.
      Grid is always full width of this column.
      Title spans half the column (3 of 6 units), centred.
    */
    .col {
      width: 62%;
      display: flex;
      flex-direction: column;
      align-items: center;  /* centres the title block horizontally */
    }

    /* ── Title: spans half the column, centred ── */
    .title {
      width: 50%;   /* half of .col = 3 of 6 grid units */
    }

    .title a { display: block; }

    .title img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Rule ── */
    .rule {
      width: 100%;
      height: 1px;
      background: #ccc;
      align-self: stretch;   /* rule spans full column width */
    }

    /* ── Thumbnail grid ── */
    .thumb-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding-top: 6px;
    }

    .thumb-item {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1;
      background: #f0eeec;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .thumb-item:hover img { transform: scale(1.06); }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #lightbox.active { display: flex; }

    * { -webkit-tap-highlight-color: transparent; }

    #lb-img {
      max-width: min(80vw, 1080px);
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #lb-counter {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      color: #bbb;
      font-size: 11px;
      letter-spacing: 0.14em;
      font-family: sans-serif;
    }

    /* Caption: sits below counter, centred, max 60% width */
    #lb-caption {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.6;
      font-family: sans-serif;
    }

    #lb-close {
      position: absolute;
      top: 18px;
      right: 24px;
      background: none;
      border: none;
      color: #bbb;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      transition: color 0.2s;
      font-weight: 300;
    }

    #lb-close:hover { color: #333; }

    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ccc;
      font-size: 52px;
      cursor: pointer;
      padding: 16px 20px;
      line-height: 1;
      transition: color 0.2s;
      user-select: none;
      font-weight: 200;
    }

    .lb-arrow:hover { color: #666; }
    #lb-prev { left: 8px; }
    #lb-next { right: 8px; }
    .lb-arrow.hidden { visibility: hidden; }

    /* ── Responsive ── */

    /* Tablet / wide portrait: 3 columns, title spans full width */
    @media (max-width: 900px) {
      body { padding: 32px 0 48px; }
      .col { width: 82%; }
      .title { width: 100%; }
      .thumb-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Portrait mobile: 2 columns, title full width */
    @media (max-width: 480px) {
      body { padding: 20px 0 36px; }
      .col { width: 92%; }
      .title { width: 100%; }
      .thumb-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Landscape mobile: treat like tablet */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      .col { width: 88%; }
      .thumb-grid { grid-template-columns: repeat(5, 1fr); }
      .title { width: 50%; }
    }
  </style>
</head>
<body>
  <div class="col">

    <div class="title">
      <a href="index.html">
        <img
          src="images/home/title_1440.webp"
          srcset="images/home/title_720.webp 720w, images/home/title_1440.webp 1440w"
          sizes="(max-width: 600px) 92vw, (max-width: 900px) 82vw, 31vw"
          alt="Obverse — home">
      </a>
    </div>

    <div class="rule"></div>

    <div class="thumb-grid" id="thumbGrid"></div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button id="lb-close" aria-label="Close">&#x2715;</button>
    <button class="lb-arrow" id="lb-prev" aria-label="Previous">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow" id="lb-next" aria-label="Next">&#8250;</button>
    <div id="lb-counter"></div>
    <div id="lb-caption"></div>
  </div>

  <script>
    const boxes = [
      { thumb: 'bx_thm_01.jpg', seq: ['bx_seq_01.1.jpg','bx_seq_01.2.jpg'],
        captions: ['',''] },
      { thumb: 'bx_thm_02.jpg', seq: ['bx_seq_02.1.jpg','bx_seq_02.2.jpg'],
        captions: ['',''] },
      { thumb: 'bx_thm_03.jpg', seq: ['bx_seq_03.1.jpg','bx_seq_03.2.jpg','bx_seq_03.3.jpg','bx_seq_03.4.jpg'],
        captions: ['','','',''] },
      { thumb: 'bx_thm_04.jpg', seq: ['bx_seq_04.1.jpg','bx_seq_04.2.jpg'],
        captions: ['',''] },
      { thumb: 'bx_thm_05.jpg', seq: ['bx_seq_05.1.jpg','bx_seq_05.2.jpg','bx_seq_05.3.jpg','bx_seq_05.4.jpg'],
        captions: ['Made from 3mm Flugply','very hard to cut and burn','','Hurts my hands'] },
      { thumb: 'bx_thm_06.jpg', seq: ['bx_seq_06.1.jpg','bx_seq_06.2.jpg','bx_seq_06.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_07.jpg', seq: ['bx_seq_07.1.jpg','bx_seq_07.2.jpg','bx_seq_07.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_08.jpg', seq: ['bx_seq_08.1.jpg','bx_seq_08.2.jpg','bx_seq_08.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_09.jpg', seq: ['bx_seq_09.1.jpg','bx_seq_09.2.jpg','bx_seq_09.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_10.jpg', seq: ['bx_seq_10.1.jpg','bx_seq_10.2.jpg','bx_seq_10.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_11.jpg', seq: ['bx_seq_11.1.jpg','bx_seq_11.2.jpg','bx_seq_11.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_12.jpg', seq: ['bx_seq_12.1.jpg','bx_seq_12.2.jpg','bx_seq_12.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_13.jpg', seq: ['bx_seq_13.1.jpg','bx_seq_13.2.jpg'],
        captions: ['',''] },
      { thumb: 'bx_thm_14.jpg', seq: ['bx_seq_14.1.jpg','bx_seq_14.2.jpg','bx_seq_14.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_15.jpg', seq: ['bx_seq_15.1.jpg','bx_seq_15.2.jpg','bx_seq_15.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_16.jpg', seq: ['bx_seq_16.1.jpg','bx_seq_16.2.jpg'],
        captions: ['',''] },
      { thumb: 'bx_thm_17.jpg', seq: ['bx_seq_17.1.jpg','bx_seq_17.2.jpg','bx_seq_17.3.jpg'],
        captions: ['','',''] },
      { thumb: 'bx_thm_18.jpg', seq: ['bx_seq_18.1.jpg'],
        captions: [''] },
    ];

    const thumbPath = 'images/bx_thm/';
    const seqPath   = 'images/bx_seq/';

    // Build grid
    const grid = document.getElementById('thumbGrid');
    boxes.forEach((box, i) => {
      const item = document.createElement('div');
      item.className = 'thumb-item';
      const img = document.createElement('img');
      img.src = thumbPath + box.thumb;
      img.alt = 'Box ' + (i + 1);
      img.loading = 'lazy';
      item.appendChild(img);
      item.addEventListener('click', () => openLightbox(i, 0));
      grid.appendChild(item);
    });

    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lb-img');
    const lbPrev  = document.getElementById('lb-prev');
    const lbNext  = document.getElementById('lb-next');
    const lbClose = document.getElementById('lb-close');
    const lbCount = document.getElementById('lb-counter');
    const lbCap   = document.getElementById('lb-caption');

    let curBox = 0, curImg = 0;

    function openLightbox(boxIdx, imgIdx) {
      curBox = boxIdx; curImg = imgIdx;
      showImage();
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function showImage() {
      const seq = boxes[curBox].seq;
      lbImg.src = seqPath + seq[curImg];
      lbImg.alt = 'Box ' + (curBox + 1) + ', image ' + (curImg + 1);
      lbCount.textContent = seq.length > 1 ? (curImg + 1) + ' / ' + seq.length : '';
      lbCap.textContent = (boxes[curBox].captions && boxes[curBox].captions[curImg]) || '';
      lbPrev.classList.toggle('hidden', curImg === 0);
      lbNext.classList.toggle('hidden', curImg === seq.length - 1);
    }

    function closeLightbox() {
      lb.classList.remove('active');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    lbPrev.addEventListener('click', () => { if (curImg > 0) { curImg--; showImage(); } });
    lbNext.addEventListener('click', () => {
      if (curImg < boxes[curBox].seq.length - 1) { curImg++; showImage(); }
    });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft'  && curImg > 0) { curImg--; showImage(); }
      if (e.key === 'ArrowRight' && curImg < boxes[curBox].seq.length - 1) { curImg++; showImage(); }
    });
  </script>

</body>
</html>

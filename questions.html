<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obverse — Questions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 0 64px; }
    .col { width: 62%; display: flex; flex-direction: column; align-items: center; }
    .title { width: 50%; }
    .title a { display: block; }
    .title img { width: 100%; height: auto; display: block; }
    .rule { width: 100%; height: 1px; background: #ccc; align-self: stretch; }
    .placeholder { align-self: stretch; padding: 80px 40px; text-align: center; color: #aaa; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-family: sans-serif; }
    @media (max-width: 900px) { body { padding: 32px 0 48px; } .col { width: 82%; } .title { width: 100%; } }
    @media (max-width: 480px) { body { padding: 20px 0 36px; } .col { width: 92%; } }
  </style>
</head>
<body>
  <div class="col">
    <div class="title">
      <a href="index.html">
        <img
          src="images/home/title_1440.webp"
          srcset="images/home/title_720.webp 720w, images/home/title_1440.webp 1440w"
          sizes="(max-width: 480px) 92vw, (max-width: 900px) 82vw, 31vw"
          alt="Obverse — home">
      </a>
    </div>
    <div class="rule"></div>
    <div class="placeholder">Page coming soon</div>
  </div>
</body>
</html>

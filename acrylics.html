<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obverse — Acrylics</title>
  <meta name="description" content="Obverse acrylic designs — laser-engraved and guilloche-inspired acrylic works.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 64px;
    }

    .col {
      width: 62%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title { width: 50%; }
    .title a { display: block; }
    .title img { width: 100%; height: auto; display: block; }

    .rule { width: 100%; height: 1px; background: #ccc; align-self: stretch; }

    .thumb-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding-top: 6px;
    }

    .thumb-item {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1;
      background: #f0eeec;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .thumb-item:hover img { transform: scale(1.06); }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #lightbox.active { display: flex; }

    #lb-img {
      max-width: min(80vw, 1080px);
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    #lb-counter {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: #bbb;
      font-size: 11px;
      letter-spacing: 0.14em;
      font-family: sans-serif;
    }

    #lb-caption {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      text-align: center;
      color: #999;
      font-size: 12px;
      line-height: 1.6;
      font-family: sans-serif;
    }

    #lb-close {
      position: absolute;
      top: 18px;
      right: 24px;
      background: none;
      border: none;
      color: #bbb;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      transition: color 0.2s;
      font-weight: 300;
    }

    #lb-close:hover { color: #333; }

    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ccc;
      font-size: 52px;
      cursor: pointer;
      padding: 16px 20px;
      line-height: 1;
      transition: color 0.2s;
      user-select: none;
      font-weight: 200;
    }

    .lb-arrow:hover { color: #666; }
    #lb-prev { left: 8px; }
    #lb-next { right: 8px; }
    .lb-arrow.hidden { visibility: hidden; }

    /* Responsive */
    @media (max-width: 900px) {
      body { padding: 32px 0 48px; }
      .col { width: 82%; }
      .title { width: 100%; }
      .thumb-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 480px) {
      body { padding: 20px 0 36px; }
      .col { width: 92%; }
      .title { width: 100%; }
      .thumb-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      .col { width: 88%; }
      .thumb-grid { grid-template-columns: repeat(5, 1fr); }
      .title { width: 50%; }
    }
  </style>
</head>
<body>
  <div class="col">

    <div class="title">
      <a href="index.html">
        <img
          src="images/home/title_1440.webp"
          srcset="images/home/title_720.webp 720w, images/home/title_1440.webp 1440w"
          sizes="(max-width: 480px) 92vw, (max-width: 900px) 82vw, 31vw"
          alt="Obverse — home">
      </a>
    </div>

    <div class="rule"></div>
    <div class="thumb-grid" id="thumbGrid"></div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button id="lb-close" aria-label="Close">&#x2715;</button>
    <button class="lb-arrow" id="lb-prev" aria-label="Previous">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arrow" id="lb-next" aria-label="Next">&#8250;</button>
    <div id="lb-counter"></div>
    <div id="lb-caption"></div>
  </div>

  <script>
    // Acrylics sequence data
    // Note: acryl_3.1.2_thm excluded intentionally
    const acrylics = [
      { thumb: 'acryl_1.1_thm.jpg',  seq: ['1.1.1.jpg','1.1.2.jpg','1.1.3.jpg','1.1.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_1.2_thm.jpg',  seq: ['1.2.1.jpg','1.2.2.jpg','1.2.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_2.1_thm.jpg',  seq: ['2.1.1.jpg','2.1.2.jpg','2.1.3.jpg','2.1.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_2.3_thm.jpg',  seq: ['2.3.1.jpg','2.3.2.jpg','2.3.3.jpg','2.3.4.jpg','2.3.5.jpg','2.3.6.jpg'],
        captions: ['', '', '', '', '', '', ''] },
      { thumb: 'acryl_2.4_thm.jpg',  seq: ['2.4.1.jpg','2.4.2.jpg','2.4.3.jpg','2.4.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_2.5_thm.jpg',  seq: ['2.5.1.jpg','2.5.2.jpg','2.5.3.jpg','2.5.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_2.7_thm.jpg',  seq: ['2.7.1.jpg','2.7.2.jpg'],
        captions: ['', '', ''] },
      { thumb: 'acryl_3.1_thm.jpg',  seq: ['3.1.1.jpg','3.1.2.jpg','3.1.3.jpg','3.1.4.jpg','3.1.5.jpg'],
        captions: ['', '', '', '', '', ''] },
      { thumb: 'acryl_3.2_thm.jpg',  seq: ['3.2.1.jpg','3.2.2.jpg','3.2.3.jpg','3.2.4.jpg','3.2.5.jpg','3.2.6.jpg','3.2.7.jpg'],
        captions: ['', '', '', '', '', '', '', ''] },
      { thumb: 'acryl_3.3_thm.jpg',  seq: ['3.3.1.jpg','3.3.2.jpg'],
        captions: ['', '', ''] },
      { thumb: 'acryl_3.4_thm.jpg',  seq: ['3.4.1.jpg','3.4.2.jpg','3.4.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_3.5_thm.jpg',  seq: ['3.5.1.jpg','3.5.2.jpg','3.5.3.jpg','3.5.4.jpg','3.5.5.jpg'],
        captions: ['', '', '', '', '', ''] },
      { thumb: 'acryl_4.1_thm.jpg',  seq: ['4.1.1.jpg','4.1.2.jpg','4.1.3.jpg','4.1.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_4.2_thm.jpg',  seq: ['4.2.1.jpg','4.2.2.jpg','4.2.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_4.3_thm.jpg',  seq: ['4.3.1.jpg','4.3.2.jpg','4.3.3.jpg','4.3.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_5.1_thm.jpg',  seq: ['5.1.1.jpg','5.1.2.jpg','5.1.3.jpg','5.1.4.jpg','5.1.5.jpg','5.1.6.jpg'],
        captions: ['', '', '', '', '', '', ''] },
      { thumb: 'acryl_5.2_thm.jpg',  seq: ['5.2.1.jpg','5.2.2.jpg','5.2.3.jpg','5.2.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_5.3_thm.jpg',  seq: ['5.3.1.jpg','5.3.2.jpg','5.3.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_5.4_thm.jpg',  seq: ['5.4.1.jpg','5.4.2.jpg','5.4.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_6.1_thm.jpg',  seq: ['6.1.jpg','6.2.jpg','6.3.jpg','6.4.jpg','6.5.jpg'],
        captions: ['', '', '', '', '', ''] },
      { thumb: 'acryl_7.1_thm.jpg',  seq: ['7.1.1.jpg','7.1.2.jpg','7.1.3.jpg','7.1.4.jpg','7.1.5.jpg','7.1.6.jpg'],
        captions: ['', '', '', '', '', '', ''] },
      { thumb: 'acryl_7.2_thm.jpg',  seq: ['7.2.1.jpg','7.2.2.jpg','7.2.3.jpg','7.2.4.jpg','7.2.5.jpg'],
        captions: ['', '', '', '', '', ''] },
      { thumb: 'acryl_8.1_thm.jpg',  seq: ['8.1.jpg','8.2.jpg','8.3.jpg','8.4.jpg','8.5.jpg','8.6.jpg'],
        captions: ['', '', '', '', '', '', ''] },
      { thumb: 'acryl_9.1_thm.jpg',  seq: ['9.1.1.jpg','9.1.2.jpg','9.1.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_9.2_thm.jpg',  seq: ['9.2.1.jpg','9.2.2.jpg','9.2.3.jpg','9.2.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_10_thm.jpg',   seq: ['10.1.jpg','10.2.jpg','10.3.jpg','10.4.jpg'],
        captions: ['', '', '', '', ''] },
      { thumb: 'acryl_11_thm.jpg',   seq: ['11.1.jpg','11.2.jpg','11.3.jpg','11.4.jpg','11.5.jpg','11.6.jpg'],
        captions: ['', '', '', '', '', '', ''] },
      { thumb: 'acryl_12_thm.jpg',   seq: ['12.1.jpg','12.2.jpg','12.3.jpg'],
        captions: ['', '', '', ''] },
      { thumb: 'acryl_13.1_thm.jpg', seq: ['13.1.1.jpg'],
        captions: ['', ''] },
      { thumb: 'acryl_14.1_thm.jpg', seq: ['14.1.1.jpg','14.1.2.jpg'],
        captions: ['', '', ''] },
    ];

    const thumbPath = 'images/acryl_thm/';
    const seqPath   = 'images/acryl_seq/';

    // Build grid
    const grid = document.getElementById('thumbGrid');
    acrylics.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      const img = document.createElement('img');
      img.src = thumbPath + item.thumb;
      img.alt = 'Acrylic ' + (i + 1);
      img.loading = 'lazy';
      div.appendChild(img);
      div.addEventListener('click', () => openLightbox(i, 0));
      grid.appendChild(div);
    });

    // Lightbox
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lb-img');
    const lbPrev  = document.getElementById('lb-prev');
    const lbNext  = document.getElementById('lb-next');
    const lbClose = document.getElementById('lb-close');
    const lbCount = document.getElementById('lb-counter');
    const lbCap   = document.getElementById('lb-caption');

    let curItem = 0, curImg = 0;

    function openLightbox(itemIdx, imgIdx) {
      curItem = itemIdx; curImg = imgIdx;
      showImage();
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function showImage() {
      const seq = acrylics[curItem].seq;
      lbImg.src = seqPath + seq[curImg];
      lbImg.alt = 'Acrylic ' + (curItem + 1) + ', image ' + (curImg + 1);
      lbCount.textContent = seq.length > 1 ? (curImg + 1) + ' / ' + seq.length : '';
      lbCap.textContent = (acrylics[curItem].captions && acrylics[curItem].captions[curImg]) || '';
      lbPrev.classList.toggle('hidden', curImg === 0);
      lbNext.classList.toggle('hidden', curImg === seq.length - 1);
    }

    function closeLightbox() {
      lb.classList.remove('active');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    lbPrev.addEventListener('click', () => { if (curImg > 0) { curImg--; showImage(); } });
    lbNext.addEventListener('click', () => {
      if (curImg < acrylics[curItem].seq.length - 1) { curImg++; showImage(); }
    });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft'  && curImg > 0) { curImg--; showImage(); }
      if (e.key === 'ArrowRight' && curImg < acrylics[curItem].seq.length - 1) { curImg++; showImage(); }
    });
  </script>
</body>
</html>
